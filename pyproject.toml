[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cninfo-chain-explorer"
version = "0.1.0"
description = "Windows batch collector for CNINFO industry-chain data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1,<4",
  "playwright>=1.50,<2",
  "PyMySQL>=1.1,<2",
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[project.scripts]
cninfo-chain = "cninfo_chain.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cninfo_chain = ["bridge.js", "migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["mysql: requires a disposable MySQL 8.0 schema"]
